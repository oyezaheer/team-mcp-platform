{{- $rootPassword := required "secrets.mariadb.rootPassword is required" .Values.secrets.mariadb.rootPassword -}}
{{- $mariadbPassword := required "secrets.mariadb.password is required" .Values.secrets.mariadb.password -}}
{{- $postgresPassword := required "secrets.postgres.password is required" .Values.secrets.postgres.password -}}
{{- $consumerKey := required "secrets.woocommerce.consumerKey is required" .Values.secrets.woocommerce.consumerKey -}}
{{- $consumerSecret := required "secrets.woocommerce.consumerSecret is required" .Values.secrets.woocommerce.consumerSecret -}}
{{- $databaseUrl := required "secrets.gateway.databaseUrl is required" .Values.secrets.gateway.databaseUrl -}}
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
  labels:
    {{- include "team-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: {{ .Values.secrets.mariadb.rootPassword | quote }}
  MARIADB_DATABASE: {{ .Values.secrets.mariadb.database | quote }}
  MARIADB_USER: {{ .Values.secrets.mariadb.user | quote }}
  MARIADB_PASSWORD: {{ .Values.secrets.mariadb.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    {{- include "team-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgres.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: woocommerce-secret
  labels:
    {{- include "team-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  WOOCOMMERCE_URL: {{ .Values.secrets.woocommerce.url | quote }}
  WOOCOMMERCE_CONSUMER_KEY: {{ .Values.secrets.woocommerce.consumerKey | quote }}
  WOOCOMMERCE_CONSUMER_SECRET: {{ .Values.secrets.woocommerce.consumerSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secret
  labels:
    {{- include "team-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.gateway.databaseUrl | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-secret
  labels:
    {{- include "team-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  LLM_API_KEY: {{ .Values.secrets.llm.apiKey | quote }}
  LLM_BASE_URL: {{ .Values.secrets.llm.baseUrl | default "https://api.openai.com/v1" | quote }}
  LLM_MODEL: {{ .Values.secrets.llm.model | default "gpt-4o-mini" | quote }}
