apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  labels:
    {{- include "team-mcp.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.storage.mariadb.accessMode | default "ReadWriteOnce" }}
  {{- if .Values.storage.storageClass }}
  storageClassName: {{ .Values.storage.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.mariadb.size }}
---
