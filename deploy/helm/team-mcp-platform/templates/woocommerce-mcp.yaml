apiVersion: apps/v1
kind: Deployment
metadata:
  name: woocommerce-mcp
  labels:
    app: woocommerce-mcp
    {{- include "team-mcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woocommerce-mcp
  template:
    metadata:
      labels:
        app: woocommerce-mcp
    spec:
      containers:
        - name: woocommerce-mcp
          image: "{{ .Values.woocommerceMcp.image.repository }}:{{ .Values.woocommerceMcp.image.tag }}"
          imagePullPolicy: {{ .Values.woocommerceMcp.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.woocommerceMcp.port }}
          env:
            - name: PORT
              value: {{ .Values.woocommerceMcp.port | quote }}
            - name: WOOCOMMERCE_URL
              valueFrom:
                secretKeyRef:
                  name: woocommerce-secret
                  key: WOOCOMMERCE_URL
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: woocommerce-secret
                  key: WOOCOMMERCE_CONSUMER_KEY
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: woocommerce-secret
                  key: WOOCOMMERCE_CONSUMER_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.woocommerceMcp.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.woocommerceMcp.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.woocommerceMcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: woocommerce-mcp
  labels:
    app: woocommerce-mcp
    {{- include "team-mcp.labels" . | nindent 4 }}
spec:
  selector:
    app: woocommerce-mcp
  ports:
    - name: http
      port: {{ .Values.woocommerceMcp.port }}
      targetPort: {{ .Values.woocommerceMcp.port }}
  type: ClusterIP
