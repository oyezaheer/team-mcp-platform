global:
  namespace: team-mcp

environment: local

# Storage Configuration
storage:
  storageClass: ""
  mariadb:
    size: 5Gi
    accessMode: ReadWriteOnce
  wordpress:
    size: 5Gi
    accessMode: ReadWriteOnce
  postgres:
    size: 2Gi
    accessMode: ReadWriteOnce

# Secrets Configuration
# WARNING: Do not commit real credentials here for production.
# Override these via --set or a separate secrets file at deploy time.
secrets:
  mariadb:
    rootPassword: ""
    database: "wordpress"
    user: "wordpress"
    password: ""
  postgres:
    password: ""
  woocommerce:
    url: "http://wordpress"
    consumerKey: ""
    consumerSecret: ""
  gateway:
    databaseUrl: ""
    encryptionKey: ""
  llm:
    apiKey: ""
    baseUrl: "https://api.openai.com/v1"
    model: "gpt-4o-mini"

# MariaDB Deployment
mariadb:
  image:
    repository: mariadb
    tag: "11.4"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# WordPress Deployment
wordpress:
  image:
    repository: wordpress
    tag: php8.3-apache
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  siteUrl: ""

# PostgreSQL Deployment
postgres:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Gateway Service
gateway:
  image:
    repository: team-mcp-gateway
    tag: 1.0.17
    pullPolicy: IfNotPresent
  port: 4000
  # Overrides DASHBOARD_ORIGIN env var. Defaults to http://<ingress.hosts.dashboard>
  # dashboardOrigin: "https://dashboard.yourdomain.com"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Dashboard (React + nginx)
dashboard:
  image:
    repository: team-mcp-dashboard
    tag: 1.0.3
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# WooCommerce MCP Service
woocommerceMcp:
  image:
    repository: team-mcp-woocommerce
    tag: 1.0.5
    pullPolicy: IfNotPresent
  port: 3003
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Inventory MCP Service
inventoryMcp:
  image:
    repository: team-mcp-inventory
    tag: local
    pullPolicy: IfNotPresent
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Support MCP Service
supportMcp:
  image:
    repository: support-mcp
    tag: 1.0.0
    pullPolicy: IfNotPresent
  port: 3004
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  hosts:
    store: "store.local"
    gateway: "gateway.local"
    dashboard: "dashboard.local"
  tls: []

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
