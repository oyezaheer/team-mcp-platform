# Local Development Values (Docker Desktop, Kind, k3d, Minikube)
environment: local

storage:
  storageClass: ""
  mariadb:
    size: 5Gi
  wordpress:
    size: 5Gi
  postgres:
    size: 2Gi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    store: "store.localtest.me"
    gateway: "gateway.localtest.me"
    dashboard: "dashboard.localtest.me"
  tls: []

secrets:
  llm:
    baseUrl: "http://host.docker.internal:11434/v1"
    model: "qwen2.5:3b"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
