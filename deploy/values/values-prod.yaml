# Production VPS Values (k3s, Cloud VPS, Hetzner, DigitalOcean)
environment: production

storage:
  storageClass: "local-path" # Standard for k3s on VPS
  mariadb:
    size: 20Gi
  wordpress:
    size: 20Gi
  postgres:
    size: 10Gi

ingress:
  enabled: true
  className: "traefik" # Default for k3s
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    store: "store.yourdomain.com"
    gateway: "mcp.yourdomain.com"
    dashboard: "dashboard.yourdomain.com"
  tls:
    - secretName: platform-tls-cert
      hosts:
        - "store.yourdomain.com"
        - "mcp.yourdomain.com"
        - "dashboard.yourdomain.com"

# Hardened production limits
mariadb:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

wordpress:
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

gateway:
  # In production, override DASHBOARD_ORIGIN explicitly
  dashboardOrigin: "https://dashboard.yourdomain.com"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

dashboard:
  image:
    repository: team-mcp-dashboard
    tag: 1.0.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# LLM secrets â€” override at deploy time, never commit real keys
# helm upgrade --install ... --set secrets.llm.apiKey="sk-..." --set secrets.llm.model="gpt-4o"
secrets:
  llm:
    apiKey: ""
    baseUrl: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
