# Production VPS Values (k3s, Cloud VPS, Hetzner, DigitalOcean)
environment: production

storage:
  storageClass: "local-path" # Standard for k3s on VPS
  mariadb:
    size: 20Gi
  wordpress:
    siteUrl: "https://store.yourdomain.com"
    size: 20Gi
  postgres:
    size: 10Gi

ingress:
  enabled: true
  className: "traefik" # Default for k3s
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    store: "store.yourdomain.com"
    gateway: "mcp.yourdomain.com"
    dashboard: "dashboard.yourdomain.com"
  tls:
    - secretName: platform-tls-cert
      hosts:
        - "store.yourdomain.com"
        - "mcp.yourdomain.com"
        - "dashboard.yourdomain.com"

# Hardened production limits
mariadb:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

wordpress:
  siteUrl: "https://store.yourdomain.com"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

gateway:
  image:
    repository: ghcr.io/oyezaheer/team-mcp-gateway
    tag: "1.0.18"
    pullPolicy: IfNotPresent
  dashboardOrigin: "https://dashboard.yourdomain.com"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

dashboard:
  image:
    repository: ghcr.io/oyezaheer/team-mcp-dashboard
    tag: 1.0.3
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# LLM configuration
secrets:
  llm:
    apiKey: ""
    baseUrl: "https://api.openai.com/v1"
    model: "gpt-4o-mini"

networkPolicy:
  enabled: true
  ingressControllerNamespace: kube-system

woocommerceMcp:
  image:
    repository: ghcr.io/oyezaheer/team-mcp-woocommerce
    tag: "1.0.5"
inventoryMcp:
  image:
    repository: ghcr.io/oyezaheer/inventory-mcp
    tag: "1.0.0"
supportMcp:
  image:
    repository: ghcr.io/oyezaheer/support-mcp
    tag: "1.0.0"
