
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-mcp
  namespace: team-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-mcp
  template:
    metadata:
      labels:
        app: inventory-mcp
    spec:
      containers:
        - name: inventory-mcp
          image: inventory-mcp:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-mcp
  namespace: team-mcp
spec:
  selector:
    app: inventory-mcp
  ports:
    - name: http
      port: 3001
      targetPort: 3001
  type: ClusterIP
