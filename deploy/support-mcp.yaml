apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-mcp
  namespace: team-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: support-mcp
  template:
    metadata:
      labels:
        app: support-mcp
    spec:
      containers:
        - name: support-mcp
          image: support-mcp:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: support-mcp
  namespace: team-mcp
spec:
  selector:
    app: support-mcp
  ports:
    - name: http
      port: 3004
      targetPort: 3004
  type: ClusterIP
